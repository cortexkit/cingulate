[package]
name = "cingulate-store"
version = "0.8.0"
edition = "2021"
license = "MIT"
publish = false
description = "Durable, orchestrator-independent consent card lifecycle and feeds."

[dependencies]
cingulate-decode = { path = "../cingulate-decode" }
cortexkit-lease = "=0.1.2"
cortexkit-store = { version = "=0.2.4", features = ["sqlite"] }
cortexkit-store-types = "=0.2.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
