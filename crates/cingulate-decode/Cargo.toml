[package]
name = "cingulate-decode"
version = "0.13.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/cortexkit/cingulate"
description = "Closed wire decoding and fail-closed validation for consent requests"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
