[package]
name = "ck-cingulate"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
cingulate-decode = { path = "../cingulate-decode" }
cingulate-store = { path = "../cingulate-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subc-client-rs = "=0.25.2"
subc-protocol = "=0.28.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
