[package]
name = "ck-cingulate"
version = "0.5.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
cingulate-decode = { path = "../cingulate-decode" }
cingulate-store = { path = "../cingulate-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
subc-client-rs = "=0.27.0"
subc-protocol = "=0.30.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
cortexkit-test-support = "=0.1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
subc-daemon = { version = "=0.33.0", features = ["test-support"] }
subc-transport = "=0.11.0"
tempfile = "3"
