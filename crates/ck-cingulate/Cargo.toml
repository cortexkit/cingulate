[package]
name = "ck-cingulate"
version = "0.10.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
cingulate-decode = { path = "../cingulate-decode" }
cingulate-store = { path = "../cingulate-store" }
cortexkit-lease = "=0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
subc-client-rs = "=0.30.1"
subc-protocol = "=0.32.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
cortexkit-test-support = "=0.1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
subc-daemon = { version = "=0.36.14", features = ["test-support"] }
subc-transport = "=0.13.0"
tempfile = "3"
tracing-subscriber = "0.3"
