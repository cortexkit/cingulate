[package]
name = "ck-cingulate"
version = "0.25.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/cortexkit/cingulate"

[features]
default = []
dev-local-operator = []

[dependencies]
async-trait = "0.1"
cortexkit-bus-client = "=0.1.1"
cortexkit-bus-naming = "=0.4.2"
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "kv", "nkeys", "nuid", "ring", "server_2_10"] }
cingulate-decode = { path = "../cingulate-decode" }
cortexkit-presence = "0.1.0"
cingulate-store = { path = "../cingulate-store" }
cortexkit-agent-identity = "=0.1.1"
cortexkit-lease = "=0.1.2"
cortexkit-project-identity = "=0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
subc-client-rs = "=0.40.3"
subc-protocol = "=0.37.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
cortexkit-test-support = "=0.1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
subc-daemon = { version = "=0.47.2", features = ["test-support"] }
subc-transport = "=0.18.0"
tempfile = "3"
