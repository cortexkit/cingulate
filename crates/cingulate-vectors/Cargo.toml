[package]
name = "cingulate-vectors"
version = "0.16.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/cortexkit/cingulate"
publish = false

[dev-dependencies]
hpke = { version = "0.11", default-features = false, features = ["std", "x25519"] }
rand_chacha = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
base64 = "0.22"
async-trait = "0.1"
cingulate-decode = { path = "../cingulate-decode" }
cingulate-store = { path = "../cingulate-store" }
cortexkit-store = { version = "=0.2.4", features = ["sqlite"] }
ck-cingulate = { path = "../ck-cingulate" }
cortexkit-presence = "0.1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
subc-client-rs = "=0.40.3"
subc-protocol = "=0.37.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
